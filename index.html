<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirels Visual | Vídeos, Webs y Contenido Premium para Alojamientos</title>

<meta name="description" content="Creamos vídeos promocionales, páginas web y contenido visual premium para alojamientos turísticos, hoteles, inmobiliarias y empresas que quieren vender más gracias a una imagen exclusiva.">

<meta name="keywords" content="video hotel, video alojamiento turístico, diseño web hotel, contenido visual premium, marketing hotelero, inmobiliaria, Airbnb">

<meta name="author" content="Kirels Visual">

<meta property="og:title" content="Kirels Visual">
<meta property="og:description" content="Contenido visual premium para alojamientos y empresas.">
<meta property="og:type" content="website">

<meta name="theme-color" content="#050505">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

background:#050505;

color:white;

font-family:'Manrope',sans-serif;

overflow-x:hidden;

line-height:1.6;

}

img{

max-width:100%;

display:block;

}

a{

text-decoration:none;

color:inherit;

}

section{

position:relative;

padding:140px 8%;

overflow:hidden;

}

.container{

max-width:1450px;

margin:auto;

}

:root{

--gold:#d4af73;

--gold2:#f2d7a4;

--black:#050505;

--black2:#0d0d0d;

--card:#111111;

--border:rgba(255,255,255,.08);

--glass:rgba(255,255,255,.04);

--shadow:0 30px 80px rgba(0,0,0,.55);

--radius:26px;

--transition:.45s cubic-bezier(.22,.61,.36,1);

}

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at 15% 20%,rgba(212,175,115,.08),transparent 25%),

radial-gradient(circle at 85% 15%,rgba(212,175,115,.05),transparent 25%),

radial-gradient(circle at 50% 100%,rgba(212,175,115,.05),transparent 35%);

pointer-events:none;

z-index:-3;

}

body::after{

content:"";

position:fixed;

inset:0;

background-image:

linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),

linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

background-size:80px 80px;

opacity:.15;

z-index:-2;

pointer-events:none;

}

.blur-orb{

position:absolute;

width:420px;

height:420px;

border-radius:50%;

background:rgba(212,175,115,.09);

filter:blur(120px);

pointer-events:none;

}

.blur-left{

left:-180px;

top:-100px;

}

.blur-right{

right:-180px;

bottom:-100px;

}

.title-mini{

display:inline-flex;

align-items:center;

gap:10px;

padding:8px 18px;

border:1px solid rgba(212,175,115,.3);

border-radius:100px;

background:rgba(212,175,115,.05);

font-size:.78rem;

letter-spacing:2px;

text-transform:uppercase;

color:var(--gold);

margin-bottom:26px;

}

.title{

font-size:clamp(2.6rem,5vw,5rem);

font-weight:800;

line-height:1.05;

margin-bottom:28px;

}

.title span{

color:var(--gold);

}

.subtitle{

font-size:1.18rem;

color:#c9c9c9;

max-width:700px;

}

.btn{

display:inline-flex;

align-items:center;

justify-content:center;

gap:12px;

padding:18px 34px;

border-radius:100px;

transition:var(--transition);

font-weight:700;

cursor:pointer;

}

.btn-gold{

background:linear-gradient(135deg,var(--gold),var(--gold2));

color:#111;

box-shadow:0 20px 60px rgba(212,175,115,.28);

}

.btn-gold:hover{

transform:translateY(-4px);

}

.btn-dark{

background:transparent;

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(15px);

}

.btn-dark:hover{

border-color:var(--gold);

}

.glass{

background:rgba(255,255,255,.04);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.08);

box-shadow:var(--shadow);

}
