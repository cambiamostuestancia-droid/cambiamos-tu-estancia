<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirels Visual | Vídeos promocionales y páginas web premium</title>

<meta name="description" content="Creamos vídeos promocionales, páginas web y contenido visual premium para alojamientos turísticos, inmobiliarias y empresas.">

<meta name="theme-color" content="#050505">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

--gold:#c8a96a;
--gold2:#e2c98d;

--bg:#050505;
--bg2:#0b0b0b;
--card:rgba(255,255,255,.05);

--text:#ffffff;
--soft:#d0d0d0;

--radius:28px;

--shadow:0 30px 70px rgba(0,0,0,.45);

--transition:.45s cubic-bezier(.22,.61,.36,1);

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;

background:

radial-gradient(circle at top left,rgba(200,169,106,.12),transparent 30%),

radial-gradient(circle at bottom right,rgba(255,255,255,.04),transparent 25%),

linear-gradient(180deg,#020202,#080808,#050505);

color:white;

overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

width:700px;

height:700px;

left:-250px;

top:-250px;

background:

radial-gradient(circle,

rgba(200,169,106,.14),

transparent 70%);

filter:blur(60px);

pointer-events:none;

z-index:-5;

}

body::after{

content:"";

position:fixed;

right:-250px;

bottom:-250px;

width:700px;

height:700px;

background:

radial-gradient(circle,

rgba(255,255,255,.05),

transparent 70%);

filter:blur(70px);

pointer-events:none;

z-index:-5;

}

.container{

width:min(1240px,92%);

margin:auto;

}

section{

padding:140px 0;

position:relative;

}

img{

max-width:100%;

display:block;

}

a{

text-decoration:none;

color:inherit;

}

::-webkit-scrollbar{

width:9px;

}

::-webkit-scrollbar-thumb{

background:var(--gold);

border-radius:100px;

}

nav{

position:fixed;

top:22px;

left:50%;

transform:translateX(-50%);

width:min(1240px,92%);

padding:18px 28px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(10,10,10,.55);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.08);

border-radius:24px;

z-index:9999;

transition:var(--transition);

}

nav.scrolled{

padding:14px 28px;

background:rgba(8,8,8,.85);

box-shadow:var(--shadow);

}

.logo{

height:54px;

border-radius:14px;

}

.menu{

display:flex;

gap:30px;

align-items:center;

}

.menu a{

font-size:14px;

font-weight:500;

opacity:.85;

transition:.3s;

}

.menu a:hover{

color:var(--gold);

opacity:1;

}

/*==========================
        HERO
===========================*/

.hero{

min-height:100vh;

display:grid;

grid-template-columns:1.1fr .9fr;

align-items:center;

gap:90px;

padding-top:170px;

}

.hero-left h1{

font-size:clamp(52px,6vw,82px);

line-height:1.02;

margin-bottom:28px;

letter-spacing:-2px;

}

.hero-left p{

font-size:19px;

line-height:1.9;

color:var(--soft);

margin-bottom:40px;

max-width:650px;

}

.hero-buttons{

display:flex;

gap:20px;

margin-bottom:50px;

flex-wrap:wrap;

}

.btn{

display:inline-flex;

align-items:center;

justify-content:center;

padding:18px 40px;

border-radius:100px;

background:linear-gradient(135deg,var(--gold),var(--gold2));

color:#111;

font-weight:700;

transition:var(--transition);

box-shadow:0 15px 40px rgba(200,169,106,.30);

}

.btn:hover{

transform:translateY(-6px);

box-shadow:0 25px 60px rgba(200,169,106,.45);

}

.btn-outline{

display:inline-flex;

align-items:center;

justify-content:center;

padding:18px 40px;

border-radius:100px;

border:1px solid rgba(255,255,255,.12);

background:rgba(255,255,255,.03);

backdrop-filter:blur(18px);

transition:var(--transition);

}

.btn-outline:hover{

transform:translateY(-6px);

background:rgba(255,255,255,.08);

}

.hero-stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

}

.hero-stat{

padding:26px;

border-radius:24px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

transition:var(--transition);

}

.hero-stat:hover{

transform:translateY(-8px);

border-color:rgba(200,169,106,.35);

}

.hero-stat h3{

font-size:34px;

color:var(--gold);

margin-bottom:8px;

}

.hero-stat span{

color:var(--soft);

font-size:15px;

}

.hero-right{

display:flex;

justify-content:center;

align-items:center;

}

.video-box{

width:100%;

max-width:420px;

aspect-ratio:9/16;

border-radius:36px;

overflow:hidden;

position:relative;

background:#111;

border:1px solid rgba(255,255,255,.08);

box-shadow:0 40px 90px rgba(0,0,0,.45);

}

.video-box::before{

content:"";

position:absolute;

inset:-80px;

background:

radial-gradient(circle,

rgba(200,169,106,.22),

transparent 70%);

z-index:-1;

filter:blur(50px);

animation:pulse 6s ease-in-out infinite;

}

.video-box video{

width:100%;

height:100%;

object-fit:cover;

}

.video-placeholder{

width:100%;

height:100%;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

color:#888;

background:linear-gradient(135deg,#111,#1b1b1b);

}

@keyframes pulse{

0%,100%{

transform:scale(1);

opacity:.6;

}

50%{

transform:scale(1.08);

opacity:1;

}

}

/*==========================
    TITULOS
===========================*/

.section-header{

max-width:900px;

margin:0 auto 90px;

text-align:center;

}

.section-tag{

display:inline-block;

padding:10px 22px;

border-radius:100px;

background:rgba(200,169,106,.08);

border:1px solid rgba(200,169,106,.18);

color:var(--gold2);

font-size:12px;

letter-spacing:2px;

font-weight:600;

text-transform:uppercase;

margin-bottom:24px;

}

.section-title{

font-size:clamp(42px,5vw,66px);

margin-bottom:24px;

letter-spacing:-1px;

}

.section-description{

font-size:19px;

color:var(--soft);

max-width:760px;

margin:auto;

line-height:1.9;

}

/*==================================================
                PORTFOLIO PREMIUM
==================================================*/

#portfolio{

background:linear-gradient(
180deg,
transparent,
rgba(255,255,255,.015),
transparent
);

}

.portfolio-slider{

overflow-x:auto;

scroll-snap-type:x mandatory;

scroll-behavior:smooth;

padding-bottom:20px;

}

.portfolio-slider::-webkit-scrollbar{

height:8px;

}

.portfolio-slider::-webkit-scrollbar-thumb{

background:rgba(200,169,106,.35);

border-radius:100px;

}

.portfolio-track{

display:flex;

gap:35px;

width:max-content;

padding:8px;

}

.portfolio-card{

width:390px;

flex-shrink:0;

scroll-snap-align:center;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

border-radius:32px;

overflow:hidden;

backdrop-filter:blur(20px);

transition:var(--transition);

box-shadow:var(--shadow);

position:relative;

}

.portfolio-card::after{

content:"";

position:absolute;

left:-120%;

top:0;

width:70%;

height:100%;

background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.10),
transparent
);

transition:.9s;

pointer-events:none;

}

.portfolio-card:hover::after{

left:160%;

}

.portfolio-card:hover{

transform:translateY(-12px);

border-color:rgba(200,169,106,.40);

}

.portfolio-card iframe{

width:100%;

height:690px;

border:none;

background:#000;

}

.portfolio-info{

padding:32px;

}

.portfolio-info h3{

font-size:28px;

margin-bottom:14px;

}

.portfolio-info p{

font-size:16px;

line-height:1.8;

color:var(--soft);

}

/*==================================================
                SERVICIOS
==================================================*/

#servicios{

background:#080808;

}

.services-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:32px;

}

.service-card{

padding:40px;

border-radius:30px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

transition:var(--transition);

box-shadow:var(--shadow);

}

.service-card:hover{

transform:translateY(-10px);

border-color:rgba(200,169,106,.35);

}

.service-icon{

width:76px;

height:76px;

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

margin-bottom:26px;

border-radius:22px;

background:rgba(200,169,106,.10);

border:1px solid rgba(200,169,106,.20);

}

.service-card h3{

font-size:25px;

margin-bottom:18px;

}

.service-card p{

font-size:16px;

line-height:1.9;

color:var(--soft);

}

/*==================================================
                PROCESO
==================================================*/

#proceso{

background:
linear-gradient(180deg,#050505,#090909,#050505);

}

.process-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:32px;

}

.process-card{

padding:40px;

border-radius:30px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

transition:var(--transition);

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.process-card::before{

content:"";

position:absolute;

left:0;

top:0;

width:5px;

height:100%;

background:linear-gradient(var(--gold),transparent);

opacity:.6;

}

.process-card:hover{

transform:translateY(-10px);

border-color:rgba(200,169,106,.35);

}

.process-number{

font-size:58px;

font-weight:800;

color:rgba(200,169,106,.22);

margin-bottom:20px;

}

.process-card h3{

font-size:25px;

margin-bottom:18px;

}

.process-card p{

line-height:1.9;

color:var(--soft);

}

/*==================================================
                PRECIOS
==================================================*/

#precios{

background:#080808;

}

.pricing-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:35px;

align-items:stretch;

}

.pricing-card{

padding:45px;

border-radius:34px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

transition:var(--transition);

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.pricing-card:hover{

transform:translateY(-12px);

}

.pricing-card h2{

font-size:58px;

margin:22px 0;

color:var(--gold);

}

.pricing-card ul{

list-style:none;

margin:30px 0;

}

.pricing-card li{

margin-bottom:16px;

color:var(--soft);

}

.featured{

border:2px solid rgba(200,169,106,.45);

transform:scale(1.04);

}

.popular{

position:absolute;

top:22px;

right:22px;

padding:8px 18px;

border-radius:100px;

background:linear-gradient(135deg,var(--gold),var(--gold2));

color:#111;

font-size:12px;

font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

}

/*==================================================
                GARANTÍAS
==================================================*/

#garantias{

background:
linear-gradient(180deg,#050505,#0a0a0a,#050505);

}

.guarantee-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:35px;

}

.guarantee-card{

padding:42px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.08);

border-radius:30px;

backdrop-filter:blur(20px);

transition:var(--transition);

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.guarantee-card:hover{

transform:translateY(-10px);

border-color:rgba(200,169,106,.35);

}

.guarantee-number{

font-size:60px;

font-weight:800;

color:rgba(200,169,106,.18);

margin-bottom:18px;

}

.guarantee-card h3{

font-size:25px;

margin-bottom:18px;

}

.guarantee-card p{

line-height:1.9;

color:var(--soft);

}

/*==================================================
                SOBRE
==================================================*/

#sobre{

background:#070707;

}

.about-wrapper{

display:grid;

grid-template-columns:1fr 1fr;

gap:90px;

align-items:center;

}

.about-image{

position:relative;

}

.about-image img{

width:100%;

border-radius:34px;

box-shadow:0 45px 90px rgba(0,0,0,.45);

}

.about-image::after{

content:"";

position:absolute;

inset:-35px;

background:

radial-gradient(circle,

rgba(200,169,106,.12),

transparent 70%);

filter:blur(35px);

z-index:-1;

}

.about-content h2{

font-size:clamp(42px,5vw,64px);

margin:28px 0;

line-height:1.12;

}

.about-content p{

margin-bottom:22px;

line-height:1.9;

color:var(--soft);

}

.about-data{

display:flex;

gap:60px;

margin-top:45px;

flex-wrap:wrap;

}

.about-data h3{

font-size:42px;

color:var(--gold);

margin-bottom:6px;

}

.about-data span{

color:var(--soft);

font-size:15px;

}

/*==================================================
                FAQ
==================================================*/

#faq{

background:#090909;

}

.faq-container{

max-width:900px;

margin:auto;

}

.faq-item{

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.08);

border-radius:24px;

margin-bottom:20px;

overflow:hidden;

transition:var(--transition);

}

.faq-item:hover{

border-color:rgba(200,169,106,.35);

}

.faq-question{

width:100%;

padding:30px 34px;

background:none;

border:none;

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

font-size:21px;

font-weight:600;

color:#fff;

}

.faq-question span{

font-size:34px;

color:var(--gold);

transition:.35s;

}

.faq-answer{

max-height:0;

overflow:hidden;

transition:max-height .45s ease;

}

.faq-answer p{

padding:0 34px 32px;

color:var(--soft);

line-height:1.9;

}

/*==================================================
                CTA FINAL
==================================================*/

#contacto{

background:

radial-gradient(circle,

rgba(200,169,106,.10),

transparent 55%),

#050505;

}

.final-cta{

padding:90px 70px;

border-radius:40px;

text-align:center;

background:

linear-gradient(

135deg,

rgba(255,255,255,.06),

rgba(255,255,255,.02)

);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(25px);

box-shadow:0 40px 90px rgba(0,0,0,.45);

}

.final-cta h2{

font-size:clamp(46px,6vw,74px);

line-height:1.05;

margin:25px auto;

max-width:900px;

}

.final-cta p{

max-width:760px;

margin:0 auto 45px;

font-size:20px;

line-height:1.9;

color:var(--soft);

}

/*==================================================
                FOOTER
==================================================*/

footer{

padding:90px 8%;

text-align:center;

background:#040404;

border-top:1px solid rgba(255,255,255,.05);

}

footer .logo{

height:80px;

margin:auto;

margin-bottom:30px;

}

footer p{

color:#a8a8a8;

line-height:1.8;

font-size:15px;

}

/*==================================================
                ANIMACIONES
==================================================*/

.reveal{

opacity:0;

transform:translateY(60px);

transition:1s ease;

}

.reveal.active{

opacity:1;

transform:translateY(0);

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

.video-box{

animation:float 7s ease-in-out infinite;

}

/*==================================================
                RESPONSIVE
==================================================*/

@media(max-width:1100px){

.hero{

grid-template-columns:1fr;

text-align:center;

gap:60px;

}

.hero-left p{

margin:auto auto 40px;

}

.hero-buttons{

justify-content:center;

}

.hero-stats{

grid-template-columns:1fr;

}

.about-wrapper{

grid-template-columns:1fr;

gap:60px;

}

.about-content{

text-align:center;

}

.about-data{

justify-content:center;

}

}

@media(max-width:900px){

.menu{

display:none;

}

.hero{

padding-top:150px;

}

.hero-left h1{

font-size:44px;

}

.section-title{

font-size:38px;

}

.portfolio-card{

width:320px;

}

.portfolio-card iframe{

height:560px;

}

.final-cta{

padding:60px 30px;

}

}

@media(max-width:600px){

.hero-left h1{

font-size:36px;

}

.hero-left p{

font-size:17px;

}

.btn,
.btn-outline{

width:100%;

}

}
